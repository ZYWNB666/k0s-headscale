# =============================================================================
# AdminNetworkPolicy RBAC — 让 calico-node serviceaccount 能 list/watch 这两个 CRD
# =============================================================================
# 配合 00-adminnetworkpolicies-crd.yaml。felix(calico-node)需要 watch 这两个资源,
# 缺少 RBAC 会导致 unauthorized 报错。
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: calico-admin-network-policies
rules:
  - apiGroups: ["policy.networking.k8s.io"]
    resources: ["adminnetworkpolicies", "baselineadminnetworkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: calico-admin-network-policies
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: calico-admin-network-policies
subjects:
  - kind: ServiceAccount
    name: calico-node
    namespace: kube-system
