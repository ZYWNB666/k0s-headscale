# =============================================================================
# AdminNetworkPolicy / BaselineAdminNetworkPolicy CRD
# =============================================================================
# 问题: k0s v1.36 内置的 Calico chart 模板来自 v3.32,但实际部署的 Calico 镜像是
# v3.29.3。v3.32 模板里的 felix 会 watch adminnetworkpolicies / baselineadminnetworkpolicies
# 资源,但 k0s 打包的 calico_init/ CRD 目录里没有这两个 CRD(只有 19 个旧 CRD)。
# felix 反复 list 该资源导致 calico-node 一直不 ready。
#
# 修复: 手动创建这两个 CRD(必须带 api-approved.kubernetes.io annotation,否则被
# Kubernetes 拒绝)。这两个 CRD 是集群级资源,创建后持久存在于 etcd/kine,节点重启不丢。
#
# 应用方式: 由 k0s/scripts/apply-calico-fixes.sh 自动 apply;也可放进
# /var/lib/k0s/manifests/ 让 k0s 自动应用(需确保在 Calico CRD 之后)。
# =============================================================================
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: adminnetworkpolicies.policy.networking.k8s.io
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes/enhancements/pull/2096"
spec:
  group: policy.networking.k8s.io
  scope: Cluster
  names:
    kind: AdminNetworkPolicy
    plural: adminnetworkpolicies
    singular: adminnetworkpolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: baselineadminnetworkpolicies.policy.networking.k8s.io
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes/enhancements/pull/2096"
spec:
  group: policy.networking.k8s.io
  scope: Cluster
  names:
    kind: BaselineAdminNetworkPolicy
    plural: baselineadminnetworkpolicies
    singular: baselineadminnetworkpolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
